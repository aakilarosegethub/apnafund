<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ApnaFund</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .password-reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        .step-indicator::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 2px;
            background: #e0e0e0;
            z-index: 0;
        }
        .step {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }
        .step.active {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }
        .step.completed {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }
        .step-content {
            display: none;
        }
        .step-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .btn-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: white;
        }
        .alert-custom {
            border-radius: 10px;
            border: none;
        }
        .otp-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .otp-input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        .otp-input:focus {
            border-color: #667eea;
            outline: none;
        }
        .countdown {
            color: #667eea;
            font-weight: 600;
        }
        .resend-link {
            cursor: pointer;
            color: #667eea;
            text-decoration: none;
        }
        .resend-link:hover {
            text-decoration: underline;
        }
        .resend-link.disabled {
            color: #999;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="password-reset-container">
            <h2 class="text-center mb-4">
                <i class="fas fa-lock"></i> Forgot Password
            </h2>
            
            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="step active" id="step1-indicator">
                    <span>1</span>
                </div>
                <div class="step" id="step2-indicator">
                    <span>2</span>
                </div>
                <div class="step" id="step3-indicator">
                    <span>3</span>
                </div>
            </div>

            <!-- Alert Messages -->
            <div id="alert-container"></div>

            <!-- Step 1: Enter Email -->
            <div class="step-content active" id="step1">
                <h5 class="text-center mb-4">Enter Your Email</h5>
                <form id="emailForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" 
                                   placeholder="Enter your email" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-custom w-100" id="sendOtpBtn">
                        <i class="fas fa-paper-plane me-2"></i>Send OTP
                    </button>
                </form>
            </div>

            <!-- Step 2: Verify OTP -->
            <div class="step-content" id="step2">
                <h5 class="text-center mb-4">Verify OTP</h5>
                <p class="text-center text-muted mb-3">
                    OTP has been sent to: <strong id="email-display"></strong>
                </p>
                <form id="otpForm">
                    <div class="otp-input-group">
                        <input type="text" class="otp-input" id="otp1" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-input" id="otp2" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-input" id="otp3" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-input" id="otp4" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-input" id="otp5" maxlength="1" pattern="[0-9]">
                        <input type="text" class="otp-input" id="otp6" maxlength="1" pattern="[0-9]">
                    </div>
                    <input type="hidden" id="otp-code">
                    <div class="text-center mb-3">
                        <span class="countdown" id="countdown"></span>
                        <br>
                        <a href="#" class="resend-link" id="resendOtpLink" style="display: none;">
                            <i class="fas fa-redo me-1"></i>Resend OTP
                        </a>
                    </div>
                    <button type="submit" class="btn btn-custom w-100" id="verifyOtpBtn">
                        <i class="fas fa-check me-2"></i>Verify OTP
                    </button>
                    <button type="button" class="btn btn-outline-secondary w-100 mt-2" id="backToEmail">
                        <i class="fas fa-arrow-left me-2"></i>Change Email
                    </button>
                </form>
            </div>

            <!-- Step 3: Reset Password -->
            <div class="step-content" id="step3">
                <h5 class="text-center mb-4">Set New Password</h5>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="newPassword" 
                                   name="password" placeholder="Enter new password" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword1">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" 
                                   placeholder="Confirm new password" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword2">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <small class="text-danger" id="passwordMatchError" style="display: none;">
                            Passwords do not match!
                        </small>
                    </div>
                    <button type="submit" class="btn btn-custom w-100" id="resetPasswordBtn">
                        <i class="fas fa-key me-2"></i>Reset Password
                    </button>
                </form>
            </div>

            <!-- Success Message -->
            <div class="step-content" id="successStep" style="display: none;">
                <div class="text-center">
                    <i class="fas fa-check-circle text-success" style="font-size: 60px;"></i>
                    <h4 class="mt-3 text-success">Password Reset Successful!</h4>
                    <p class="text-muted">Your password has been changed successfully.</p>
                    <a href="/" class="btn btn-custom mt-3">
                        <i class="fas fa-home me-2"></i>Go to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Base URL Configuration
        let baseUrl = window.location.origin;
        
        // Check if file is opened directly (file:// protocol) or origin is invalid
        if (!baseUrl || baseUrl === 'null' || baseUrl === '' || 
            window.location.protocol === 'file:' || 
            baseUrl.startsWith('file://') ||
            baseUrl === 'null') {
            // Default server URL - change this to your server URL
            baseUrl = 'http://192.168.1.42:8000';
            console.warn('File opened directly or invalid origin. Using default server URL:', baseUrl);
        }
        
        // Ensure baseUrl doesn't end with /
        baseUrl = baseUrl.replace(/\/$/, '');
        
        const apiBaseUrl = baseUrl + '/api';
        
        // API Endpoints
        const API_ENDPOINTS = {
            sendPasswordResetOTP: apiBaseUrl + '/send_password_reset_otp.php',
            verifyPasswordResetOTP: apiBaseUrl + '/verify_password_reset_otp.php',
            resetPassword: apiBaseUrl + '/reset_password.php'
        };
        
        console.log('Base URL:', baseUrl);
        console.log('API Base URL:', apiBaseUrl);
        console.log('API Endpoints:', API_ENDPOINTS);
        
        let currentStep = 1;
        let userEmail = '';
        let resetToken = '';
        let countdownInterval = null;
        let otpSentTime = null;

        // Step Navigation
        function showStep(step) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.step').forEach(el => {
                el.classList.remove('active', 'completed');
            });

            if (step === 1) {
                document.getElementById('step1').classList.add('active');
                document.getElementById('step1-indicator').classList.add('active');
            } else if (step === 2) {
                document.getElementById('step2').classList.add('active');
                document.getElementById('step1-indicator').classList.add('completed');
                document.getElementById('step2-indicator').classList.add('active');
            } else if (step === 3) {
                document.getElementById('step3').classList.add('active');
                document.getElementById('step1-indicator').classList.add('completed');
                document.getElementById('step2-indicator').classList.add('completed');
                document.getElementById('step3-indicator').classList.add('active');
            } else if (step === 4) {
                document.getElementById('successStep').style.display = 'block';
                document.querySelectorAll('.step').forEach(el => el.classList.add('completed'));
            }

            currentStep = step;
        }

        // Show Alert
        function showAlert(message, type = 'success') {
            const alertContainer = document.getElementById('alert-container');
            const alertClass = type === 'success' ? 'alert-success' : 
                              type === 'error' ? 'alert-danger' : 'alert-info';
            alertContainer.innerHTML = `
                <div class="alert ${alertClass} alert-custom alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }

        // Step 1: Send OTP
        document.getElementById('emailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const sendOtpBtn = document.getElementById('sendOtpBtn');
            
            sendOtpBtn.disabled = true;
            sendOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending...';

            try {
                console.log('Sending OTP request to:', API_ENDPOINTS.sendPasswordResetOTP);
                console.log('Request payload:', { email: email });
                const response = await fetch(API_ENDPOINTS.sendPasswordResetOTP, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                // Check if response is OK
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }

                const responseText = await response.text();
                console.log('API Response:', responseText);
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    throw new Error('Invalid JSON response from server: ' + responseText.substring(0, 100));
                }

                if (data.ResponseCode === '200' && data.Result === 'true') {
                    userEmail = email;
                    document.getElementById('email-display').textContent = email;
                    showAlert('OTP sent successfully to your email!', 'success');
                    showStep(2);
                    startCountdown(60);
                    otpSentTime = new Date(data.time || Date.now());
                } else {
                    showAlert(data.ResponseMsg || 'Failed to send OTP', 'error');
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send OTP';
                }
            } catch (error) {
                console.error('Send OTP Error:', error);
                const errorMsg = error.message || 'An error occurred. Please try again.';
                showAlert('Error: ' + errorMsg + ' | Please check console for details.', 'error');
                sendOtpBtn.disabled = false;
                sendOtpBtn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send OTP';
            }
        });

        // OTP Input Auto-focus
        const otpInputs = ['otp1', 'otp2', 'otp3', 'otp4', 'otp5', 'otp6'];
        otpInputs.forEach((id, index) => {
            const input = document.getElementById(id);
            input.addEventListener('input', function(e) {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    document.getElementById(otpInputs[index + 1]).focus();
                }
                updateOtpCode();
            });
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    document.getElementById(otpInputs[index - 1]).focus();
                }
            });
        });

        function updateOtpCode() {
            const code = otpInputs.map(id => document.getElementById(id).value).join('');
            document.getElementById('otp-code').value = code;
        }

        // Step 2: Verify OTP
        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('otp-code').value;
            const verifyOtpBtn = document.getElementById('verifyOtpBtn');

            if (code.length !== 6) {
                showAlert('Please enter complete 6-digit OTP', 'error');
                return;
            }

            verifyOtpBtn.disabled = true;
            verifyOtpBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Verifying...';

            try {
                console.log('Verifying OTP request to:', API_ENDPOINTS.verifyPasswordResetOTP);
                console.log('Request payload:', { email: userEmail, code: code });
                const response = await fetch(API_ENDPOINTS.verifyPasswordResetOTP, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        code: code
                    })
                });

                // Check if response is OK
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }

                const responseText = await response.text();
                console.log('API Response:', responseText);
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    throw new Error('Invalid JSON response from server: ' + responseText.substring(0, 100));
                }

                if (data.ResponseCode === '200' && data.Result === 'true') {
                    resetToken = data.reset_token;
                    showAlert('OTP verified successfully!', 'success');
                    showStep(3);
                    if (countdownInterval) clearInterval(countdownInterval);
                } else {
                    showAlert(data.ResponseMsg || 'Invalid OTP', 'error');
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.innerHTML = '<i class="fas fa-check me-2"></i>Verify OTP';
                }
            } catch (error) {
                console.error('Verify OTP Error:', error);
                const errorMsg = error.message || 'An error occurred. Please try again.';
                showAlert('Error: ' + errorMsg + ' | Please check console for details.', 'error');
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.innerHTML = '<i class="fas fa-check me-2"></i>Verify OTP';
            }
        });

        // Resend OTP
        document.getElementById('resendOtpLink').addEventListener('click', async function(e) {
            e.preventDefault();
            if (this.classList.contains('disabled')) return;

            this.classList.add('disabled');
            this.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Resending...';

            try {
                console.log('Resending OTP request to:', API_ENDPOINTS.sendPasswordResetOTP);
                console.log('Request payload:', { email: userEmail });
                const response = await fetch(API_ENDPOINTS.sendPasswordResetOTP, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email: userEmail })
                });

                // Check if response is OK
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }

                const responseText = await response.text();
                console.log('API Response:', responseText);
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    throw new Error('Invalid JSON response from server: ' + responseText.substring(0, 100));
                }

                if (data.ResponseCode === '200' && data.Result === 'true') {
                    showAlert('OTP resent successfully!', 'success');
                    // Clear OTP inputs
                    otpInputs.forEach(id => document.getElementById(id).value = '');
                    document.getElementById('otp1').focus();
                    startCountdown(60);
                } else {
                    showAlert(data.ResponseMsg || 'Failed to resend OTP', 'error');
                    this.classList.remove('disabled');
                    this.innerHTML = '<i class="fas fa-redo me-1"></i>Resend OTP';
                }
            } catch (error) {
                console.error('Resend OTP Error:', error);
                const errorMsg = error.message || 'An error occurred. Please try again.';
                showAlert('Error: ' + errorMsg + ' | Please check console for details.', 'error');
                this.classList.remove('disabled');
                this.innerHTML = '<i class="fas fa-redo me-1"></i>Resend OTP';
            }
        });

        // Countdown Timer
        function startCountdown(seconds) {
            const countdownEl = document.getElementById('countdown');
            const resendLink = document.getElementById('resendOtpLink');
            let timeLeft = seconds;

            countdownEl.textContent = `Resend OTP in ${timeLeft} seconds`;
            resendLink.style.display = 'none';

            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    countdownEl.textContent = `Resend OTP in ${timeLeft} seconds`;
                } else {
                    countdownEl.textContent = '';
                    resendLink.style.display = 'inline';
                    resendLink.classList.remove('disabled');
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        // Back to Email
        document.getElementById('backToEmail').addEventListener('click', function() {
            showStep(1);
            otpInputs.forEach(id => document.getElementById(id).value = '');
            if (countdownInterval) clearInterval(countdownInterval);
            document.getElementById('countdown').textContent = '';
            document.getElementById('resendOtpLink').style.display = 'none';
        });

        // Step 3: Reset Password
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passwordMatchError = document.getElementById('passwordMatchError');
            const resetPasswordBtn = document.getElementById('resetPasswordBtn');

            if (newPassword !== confirmPassword) {
                passwordMatchError.style.display = 'block';
                return;
            }

            passwordMatchError.style.display = 'none';
            resetPasswordBtn.disabled = true;
            resetPasswordBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Resetting...';

            try {
                console.log('Reset password request to:', API_ENDPOINTS.resetPassword);
                console.log('Request payload:', { email: userEmail, password: '***' });
                const response = await fetch(API_ENDPOINTS.resetPassword, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        password: newPassword
                    })
                });

                // Check if response is OK
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error Response:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }

                const responseText = await response.text();
                console.log('API Response:', responseText);
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    throw new Error('Invalid JSON response from server: ' + responseText.substring(0, 100));
                }

                if (data.ResponseCode === '200' && data.Result === 'true') {
                    showStep(4);
                } else {
                    showAlert(data.ResponseMsg || 'Failed to reset password', 'error');
                    resetPasswordBtn.disabled = false;
                    resetPasswordBtn.innerHTML = '<i class="fas fa-key me-2"></i>Reset Password';
                }
            } catch (error) {
                console.error('Reset Password Error:', error);
                const errorMsg = error.message || 'An error occurred. Please try again.';
                showAlert('Error: ' + errorMsg + ' | Please check console for details.', 'error');
                resetPasswordBtn.disabled = false;
                resetPasswordBtn.innerHTML = '<i class="fas fa-key me-2"></i>Reset Password';
            }
        });

        // Toggle Password Visibility
        document.getElementById('togglePassword1').addEventListener('click', function() {
            const passwordInput = document.getElementById('newPassword');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('togglePassword2').addEventListener('click', function() {
            const passwordInput = document.getElementById('confirmPassword');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    </script>
</body>
</html>
